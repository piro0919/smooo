name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run secretlint
      - run: npm run build

  # Who can see which organisation and channel is enforced by row level security. Test it for real
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # latest を引くと GitHub の問い合わせ回数の制限で落ちることがある。手元と同じ版に固定する
          version: 2.84.2
      - run: supabase db start
      - run: supabase test db
